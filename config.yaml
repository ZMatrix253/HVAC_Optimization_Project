# =============================================
# HVAC Optimization Project Configuration
# =============================================

# Weather data settings
weather:
  epw_path: "data/CAN_ON_Ottawa.CDA.RCS.710630_TMYx.2011-2025.epw"
  target_year: null        # null = use full TMYx (recommended)

# Building parameters
building:
  heating_setpoint: 18.0
  cooling_setpoint: 24.0
  heating_sensitivity: 1.2
  cooling_sensitivity: 1.1
  solar_factor: 0.012
  internal_load_kW: 12.0
  area_m2: 2000.0
  load_normalization_factor: 1.25

# General constants
constants:
  electricity_cost_kwh: 0.12
  co2_factor_tonnes_per_kwh: 0.0005
  investment_cost: 50000.0
  project_lifetime_years: 15
  discount_rate: 0.05

# Baseline HVAC components
components:
  baseline:
    Chiller: 30.0
    Boiler: 15.0
    Fans: 5.0
    Pumps: 5.0
    Lighting: 8.0

# Realistic retrofit scenarios - direct nominal power overrides
scenarios:
  "VFD Fans & Pumps":
    Fans: 4.25
    Pumps: 4.25

  "Thermostat Optimization":
    Chiller: 27.5
    Boiler: 13.8

  "High Efficiency Chiller":
    Chiller: 25.0

  "LED Lighting Retrofit":
    Lighting: 4.5

  "Economizer + DCV":
    Fans: 4.4
    Chiller: 27.5

  "Combined Measures":
    Chiller: 25.0
    Boiler: 13.8
    Fans: 4.25
    Pumps: 4.25
    Lighting: 4.5

# High-level scenarios (kept for future extension)
high_level_scenarios:
  baseline:
    description: "Standard operation - no changes"
    chiller_efficiency_improvement: 0.0
    setpoint_adjustment: 0.0
    night_setback: false

  optimized:
    description: "Good balance - better chiller + smart setbacks"
    chiller_efficiency_improvement: 0.15
    setpoint_adjustment: 1.0
    night_setback: true

  aggressive:
    description: "Push it harder - maximum reasonable savings"
    chiller_efficiency_improvement: 0.25
    setpoint_adjustment: 2.0
    night_setback: true